spring.application.name=chatbot

# this removes auto configuration error between spring ai and spring cloud
spring.autoconfigure.exclude=org.springframework.cloud.function.context.config.ContextFunctionCatalogAutoConfiguration

spring.ai.ollama.base-url=http://localhost:11434
# spring.ai.ollama.chat.options.model=llama3
spring.ai.ollama.chat.options.model=gym-latvia-chatbot-llama3

# spring.ai.ollama.chat.options.model=deepseek-r1:1.5b


# Redis Configurations
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=redis