name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker images
      - run: docker-compose -f docker-compose.yml build

  test:
    needs: build
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis-latest
        ports: 
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-inteval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
      - run: docker/setup-buildx-action@v3

      - name: Compose Chatbot service
      - run: docker-compose -f docker-compose.yml build chatbot-ai

      - name: Run Chatbot service
      - run: docker-compose -f docker-compose.yml up chatbot-ai

      - name: Run Maven tests
      - run: docker exec chatbot-ai mvn test

      - name: Shut down docker-compose services
      - run: docker-compose -f docker-compose down